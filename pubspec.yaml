name: habit_tracker
description: "Habit Trail - build or quit habits with daily check-ins."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  home_widget: ^0.10.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#183B32"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#183B32"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#183B32"
    image: assets/icon/splash_logo.png
